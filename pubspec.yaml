name: agro

description: A new Flutter project.

publish_to: 'none'

version: 1.2.0+37
environment:
  sdk: '>=3.0.0-290.3.beta <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  loading_indicator: ^3.1.1
  modal_bottom_sheet: ^3.0.0-pre
  pinput: ^2.2.31
  mask_text_input_formatter: ^2.4.0
  flutter_rating_stars: ^1.0.3+4
  google_fonts: ^6.1.2
  # PERSISTENCE
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # FIREBASE
  firebase_core: ^3.8.0
  firebase_messaging: ^15.2.10


  flutter_svg: ^2.0.7

  # SERVICE
  flutter_localizations:
    sdk: flutter
  pull_to_refresh: ^2.0.0
  get: ^4.6.5
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.0.1
  mobile_scanner: ^7.0.0

  # CONNECT
  url_launcher: ^6.1.11
  http: ^1.0.0
  intl: ^0.20.2
  google_mobile_ads: ^8.0.0

dev_dependencies:
  # PERSISTENCE
  build_runner: ^2.4.9
  hive_generator: ^2.0.0
  flutter_lints: ^2.0.1
  analyzer: ^5.13.0
  dependency_validator: ^3.2.2

  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    - picture/
    - picture/auth/
    - picture/components/
    - picture/types/
    - picture/app/account/