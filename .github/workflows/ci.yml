name: CI

# Every PR and every push to develop/main: analyze, translations, tests.
# Nothing here talks to the backend (production-only) or needs secrets.
on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Generated translations are committed and complete
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n untranslated.txt
          test "$(tr -d '[:space:]' < untranslated.txt)" = "{}"

      - name: Analyze
        # Errors and warnings fail the build; old infos do not.
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test --reporter github
